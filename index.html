<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Secure Smart Stylus Notebook</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Tesseract.js for optical character recognition (Handwriting to text) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Load CryptoJS for offline secure storage -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div id="tamper-alert" class="hidden">
        <h2>SECURITY ALERT</h2>
        <p>Application focus lost. This event has been logged.</p>
        <button id="dismiss-tamper-btn">Acknowledge</button>
    </div>

    <div class="app-container">
        <!-- Question Section -->
        <div class="header">
            <h2 id="question-text">Loading...</h2>
            <div class="header-right">
                <button id="read-q-btn" class="util-btn">🔊 Read Question</button>
                <span id="sync-status" class="status-indicators">Offline - Secure</span>
            </div>
        </div>
        
        <!-- Canvas Section -->
        <div class="canvas-container" id="canvas-container">
            <canvas id="drawing-canvas"></canvas>
            
            <!-- Round Key FAB -->
            <button id="round-key" class="fab">💬</button>
            
            <div id="status-overlay" class="hidden">Reading handwriting...</div>
            <div id="boundary-overlay" class="hidden"></div>
        </div>
        
        <!-- Controls -->
        <div class="footer">
            <button id="eraser-btn">✏️ Eraser: OFF</button>
            <button id="save-btn">💾 Save</button>
            <button id="clear-btn">Clear Page</button>
            <button id="read-a-btn">🔊 Read Ans</button>
            <button id="prev-btn">⬅ Prev</button>
            <button id="next-btn">Next ➔</button>
            <button id="submit-btn" style="background-color: #27ae60; color: white;">Submit Exam</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
